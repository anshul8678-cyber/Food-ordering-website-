<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Foodie</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <style>
        .login-section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff5ef;
            padding: 50px 20px;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #ff5722;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        .login-box input[type="email"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #ff5722;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #555;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #e64a19;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .signup a {
            color: #ff5722;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            text-align: center;
            margin-top: 15px;
        }

        .home-link a {
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-box {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">🍔 Foodie</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="offers.html">Offers</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your Foodie account
            </p>

            <form>

                <!-- Email -->
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Remember Me -->
                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">
                        Remember Me
                    </label>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>

            </form>


            <!-- Signup -->
            <div class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </div>


            <!-- Home -->
            <div class="home-link">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>© 2026 Foodie. All Rights Reserved.</p>

        <p>Delicious Food | Fast Delivery | Best Offers</p>

    </footer>

</body>
</html>
